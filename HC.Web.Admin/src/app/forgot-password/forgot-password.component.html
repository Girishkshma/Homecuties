<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h1>Homecuties</h1>
      <h2>Admin Panel</h2>
      <p>Forgot your password?</p>
    </div>

    <form (ngSubmit)="forgotPassword()" class="auth-form">
      <!-- Error Message -->
      <div *ngIf="errorMessage" class="alert alert-error">
        {{ errorMessage }}
      </div>

      <!-- Success Message -->
      <div *ngIf="successMessage" class="alert alert-success">
        {{ successMessage }}
      </div>

      <!-- Reset Token (shown in dev mode) -->
      <div *ngIf="resetToken" class="alert alert-info">
        <strong>Reset Token:</strong> {{ resetToken }}<br>
        <small>Use this token to reset your password.</small>
      </div>

      <div class="form-group">
        <label for="loginId">Login ID</label>
        <input
          type="text"
          id="loginId"
          [(ngModel)]="loginId"
          name="loginId"
          placeholder="Enter your login ID"
          required
          [disabled]="isLoading"
        />
      </div>

      <button type="submit" class="btn-submit" [disabled]="isLoading">
        <span *ngIf="!isLoading">Send Reset Link</span>
        <span *ngIf="isLoading">Sending...</span>
      </button>

      <!-- Navigate to reset password if token is available -->
      <div *ngIf="resetToken" class="mt-3 text-center">
        <button type="button" class="btn-link" (click)="goToResetPassword()">
          Click here to reset your password now
        </button>
      </div>
    </form>

    <div class="auth-footer">
      Remember your password? <a routerLink="/login">Sign in</a>
    </div>
  </div>
</div>
