<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h1>Homecuties</h1>
      <h2>Admin Panel</h2>
      <p>Reset your password</p>
    </div>

    <form (ngSubmit)="resetPassword()" class="auth-form">
      <!-- Error Message -->
      <div *ngIf="errorMessage" class="alert alert-error">
        {{ errorMessage }}
      </div>

      <!-- Success Message -->
      <div *ngIf="successMessage" class="alert alert-success">
        {{ successMessage }}
        <p class="mb-0 mt-2"><small>Redirecting to login...</small></p>
      </div>

      <div class="form-group">
        <label for="newPassword">New Password</label>
        <input
          type="password"
          id="newPassword"
          [(ngModel)]="newPassword"
          name="newPassword"
          placeholder="Enter new password"
          required
          [disabled]="isLoading || successMessage.length > 0"
        />
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm New Password</label>
        <input
          type="password"
          id="confirmPassword"
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
          placeholder="Re-enter new password"
          required
          [disabled]="isLoading || successMessage.length > 0"
        />
      </div>

      <button type="submit" class="btn-submit" [disabled]="isLoading || successMessage.length > 0">
        <span *ngIf="!isLoading">Reset Password</span>
        <span *ngIf="isLoading">Resetting...</span>
      </button>
    </form>

    <div class="auth-footer">
      Remember your password? <a routerLink="/login">Sign in</a>
    </div>
  </div>
</div>
