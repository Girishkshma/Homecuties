<div class="auth-page">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6 col-xl-5">
        <div class="auth-card">
          <div class="auth-header">
            <div class="auth-logo mb-3">
              <i class="bi bi-key"></i>
            </div>
            <h2>Forgot Password</h2>
            <p>Enter your email to receive a password reset link</p>
          </div>

          <form (ngSubmit)="forgotPassword()">
            <!-- Error Message -->
            <div *ngIf="errorMessage" class="alert alert-danger" role="alert">
              {{ errorMessage }}
            </div>

            <!-- Success Message -->
            <div *ngIf="successMessage" class="alert alert-success" role="alert">
              {{ successMessage }}
            </div>

            <!-- Reset Token (shown in dev mode) -->
            <div *ngIf="resetToken" class="alert alert-info" role="alert">
              <strong>Reset Token:</strong> {{ resetToken }}<br>
              <small>Use this token to reset your password.</small>
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">Email Address</label>
              <input type="email" class="form-control" id="email" placeholder="you@example.com"
                     [(ngModel)]="email" name="email" required
                     [disabled]="isLoading">
            </div>

            <button type="submit" class="btn-submit" [disabled]="isLoading">
              <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
              <i *ngIf="!isLoading" class="bi bi-send me-2"></i>
              {{ isLoading ? 'Sending...' : 'Send Reset Link' }}
            </button>

            <!-- Navigate to reset password if token is available -->
            <div *ngIf="resetToken" class="mt-3 text-center">
              <button type="button" class="btn btn-link" (click)="goToResetPassword()">
                Click here to reset your password now
              </button>
            </div>
          </form>

          <div class="auth-footer">
            Remember your password? <a routerLink="/login">Sign in</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
