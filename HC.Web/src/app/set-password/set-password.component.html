<div class="auth-page">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5 col-xl-4">
        <div class="auth-card">
          <div class="auth-header">
            <div class="auth-logo mb-3">
              <i class="bi bi-shield-check"></i>
            </div>
            <h2>Set Your Password</h2>
            <p>One last step to finish setting up your account</p>
          </div>

          <div class="alert alert-info" role="alert">
            <i class="bi bi-info-circle me-1"></i>
            You signed in with Google. Set a password to also sign in with your email address.
          </div>

          <form (ngSubmit)="savePassword()">
            <!-- Error Message -->
            <div *ngIf="errorMessage" class="alert alert-danger" role="alert">
              {{ errorMessage }}
            </div>

            <!-- Success Message -->
            <div *ngIf="successMessage" class="alert alert-success" role="alert">
              {{ successMessage }}
              <p class="mb-0 mt-2"><small>Continuing...</small></p>
            </div>

            <div class="mb-3">
              <label for="newPassword" class="form-label">New Password</label>
              <input type="password" class="form-control" id="newPassword" placeholder="At least 6 characters"
                     [(ngModel)]="newPassword" name="newPassword" required
                     [disabled]="isLoading || successMessage.length > 0">
            </div>
            <div class="mb-4">
              <label for="confirmPassword" class="form-label">Confirm Password</label>
              <input type="password" class="form-control" id="confirmPassword" placeholder="Re-enter your password"
                     [(ngModel)]="confirmPassword" name="confirmPassword" required
                     [disabled]="isLoading || successMessage.length > 0">
            </div>

            <button type="submit" class="btn-submit" [disabled]="isLoading || successMessage.length > 0">
              <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
              <i *ngIf="!isLoading" class="bi bi-check-circle me-2"></i>
              {{ isLoading ? 'Saving...' : 'Save Password' }}
            </button>
          </form>

          <div class="auth-footer">
            <button type="button" class="link-button" (click)="skip()">I'll do this later</button>
            <span class="mx-1">&middot;</span>
            Already have a password? <a routerLink="/forgot-password">Reset it</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
