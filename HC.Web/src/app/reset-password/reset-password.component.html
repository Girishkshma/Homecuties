<div class="auth-page">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6 col-xl-5">
        <div class="auth-card">
          <div class="auth-header">
            <div class="auth-logo mb-3">
              <i class="bi bi-shield-lock"></i>
            </div>
            <h2>Reset Password</h2>
            <p>Enter your new password</p>
          </div>

          <form (ngSubmit)="resetPassword()">
            <!-- Error Message -->
            <div *ngIf="errorMessage" class="alert alert-danger" role="alert">
              {{ errorMessage }}
            </div>

            <!-- Success Message -->
            <div *ngIf="successMessage" class="alert alert-success" role="alert">
              {{ successMessage }}
              <p class="mb-0 mt-2"><small>Redirecting to login...</small></p>
            </div>

            <div class="mb-3">
              <label for="newPassword" class="form-label">New Password</label>
              <input type="password" class="form-control" id="newPassword" placeholder="Enter new password"
                     [(ngModel)]="newPassword" name="newPassword" required
                     [disabled]="isLoading || successMessage.length > 0">
            </div>
            <div class="mb-4">
              <label for="confirmPassword" class="form-label">Confirm New Password</label>
              <input type="password" class="form-control" id="confirmPassword" placeholder="Re-enter new password"
                     [(ngModel)]="confirmPassword" name="confirmPassword" required
                     [disabled]="isLoading || successMessage.length > 0">
            </div>

            <button type="submit" class="btn-submit" [disabled]="isLoading || successMessage.length > 0">
              <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
              <i *ngIf="!isLoading" class="bi bi-check-circle me-2"></i>
              {{ isLoading ? 'Resetting...' : 'Reset Password' }}
            </button>
          </form>

          <div class="auth-footer">
            Remember your password? <a routerLink="/login">Sign in</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
