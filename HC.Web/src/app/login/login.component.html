<div class="auth-page">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5 col-xl-4">
        <div class="auth-card">
          <div class="auth-header">
            <div class="auth-logo mb-3">
              <i class="bi bi-box-seam"></i>
            </div>
            <h2>Welcome Back</h2>
            <p>Sign in to your account to continue</p>
          </div>

          <!-- Shown when a guarded page (e.g. checkout) sent the guest here -->
          <div *ngIf="returnUrl" class="alert alert-info" role="alert">
            <i class="bi bi-info-circle me-1"></i>
            Please sign in to continue. Your cart and favourites will be moved to your account.
          </div>

          <!--
            Google sign-in. Google Identity Services renders its official "Continue with Google"
            button into the slot below; the id_token it returns is verified server-side (signature,
            audience and expiry) by GoogleLoginService before the customer is signed in.
            Facebook stays hidden until the API verifies its access token in the same way.
          -->
          <div class="oauth-section" [style.display]="googleReady ? null : 'none'">
            <div class="oauth-buttons">
              <div #googleButton class="google-signin-slot"></div>
            </div>
            <div class="oauth-divider">or</div>
          </div>

          <!-- Email Login Form -->
          <form (ngSubmit)="login()">
            <!-- Error Message -->
            <div *ngIf="errorMessage" class="alert alert-danger" role="alert">
              {{ errorMessage }}
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">Email Address</label>
              <input type="email" class="form-control" id="email" placeholder="you@example.com"
                     [(ngModel)]="email" name="email" required>
            </div>
            <div class="mb-4">
              <label for="password" class="form-label">Password</label>
              <input type="password" class="form-control" id="password" placeholder="Enter your password"
                     [(ngModel)]="password" name="password" required>
              <div class="text-end mt-1">
                <a routerLink="/forgot-password" class="forgot-password-link">Forgot password?</a>
              </div>
            </div>
            <button type="submit" class="btn-submit" [disabled]="isLoading">
              <i class="bi bi-box-arrow-in-right me-2"></i> Sign In
            </button>
          </form>

          <div class="auth-footer">
            Don't have an account? <a routerLink="/register">Create one</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
